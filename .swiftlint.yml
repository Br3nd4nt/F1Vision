# SwiftLint Configuration for F1Vision iOS App
# Based on best practices and production iOS app standards

# MARK: - Rule Configuration

# Disable rules that are too strict for development
disabled_rules:
  - trailing_whitespace          # Often caused by Xcode auto-formatting
  - line_length                  # Allow longer lines for better readability
  - function_body_length         # Allow longer functions during development
  - type_body_length            # Allow longer types during development
  - file_length                 # Allow longer files during development
  - cyclomatic_complexity       # Allow complex logic during development
  - large_tuple                 # Allow tuples for temporary data structures
  - unused_import               # Sometimes needed for conditional compilation
  - unused_private_declaration  # Useful for debugging and future features

# MARK: - Included and Excluded Paths

# Only lint your source code
included:
  - F1Vision

# Exclude third-party code and build artifacts
excluded:
  - Pods
  - .git
  - .build
  - DerivedData
  - *.generated.swift
  - *.pb.swift
  - *.grpc.swift

# MARK: - Rule Customization

# Customize specific rules
opt_in_rules:
  - array_init                    # Prefer Array(contentsOf:) over +=
  - closure_end_indentation      # Consistent closure formatting
  - closure_spacing              # Consistent spacing around closures
  - collection_alignment          # Align collection elements
  - contains_over_filter_count    # Prefer contains over filter.count > 0
  - contains_over_filter_is_empty # Prefer contains over filter.isEmpty
  - contains_over_first_not_nil   # Prefer contains over first != nil
  - empty_count                   # Prefer isEmpty over count == 0
  - empty_string                  # Prefer isEmpty over == ""
  - enum_case_associated_values_count # Limit associated values
  - fatal_error_message           # Require descriptive fatal error messages
  - first_where                   # Prefer first(where:) over filter.first
  - force_unwrapping              # Warn about force unwrapping
  - implicitly_unwrapped_optional # Warn about implicitly unwrapped optionals
  - last_where                    # Prefer last(where:) over filter.last
  - legacy_random                 # Use modern random APIs
  - literal_expression_end_indentation # Consistent literal formatting
  - multiline_arguments           # Consistent multiline argument formatting
  - multiline_parameters          # Consistent multiline parameter formatting
  - operator_usage_whitespace     # Consistent operator spacing
  - overridden_super_call         # Ensure super calls in overrides
  - pattern_matching_keywords     # Consistent pattern matching
  - prefer_self_type_over_type_of_self # Use Self over Type
  - redundant_nil_coalescing      # Remove unnecessary nil coalescing
  - redundant_type_annotation     # Remove unnecessary type annotations
  - sorted_imports                # Sort imports alphabetically
  - static_operator               # Use static operators when possible
  - toggle_bool                   # Use toggle() for boolean properties
  - unneeded_parentheses_in_closure_argument # Remove unnecessary parentheses
  - vertical_parameter_alignment  # Align parameters vertically
  - vertical_whitespace           # Consistent vertical spacing

# MARK: - Custom Rule Severities

# Make some rules warnings instead of errors
warning_rules:
  - force_unwrapping              # Force unwrapping is dangerous but sometimes necessary
  - implicitly_unwrapped_optional # Implicitly unwrapped optionals can be risky
  - unused_import                 # Unused imports clutter the code
  - unused_private_declaration    # Unused private declarations can be removed

# MARK: - Line Length and Formatting

# Customize line length (default is 120)
line_length:
  warning: 150
  error: 200

# MARK: - Function and Type Length Limits

# Allow longer functions during development
function_body_length:
  warning: 50
  error: 100

# Allow longer types during development
type_body_length:
  warning: 300
  error: 500

# Allow longer files during development
file_length:
  warning: 500
  error: 1000

# MARK: - Complexity Limits

# Allow moderate complexity during development
cyclomatic_complexity:
  warning: 15
  error: 25

# MARK: - Identifier Length

# Allow descriptive names
identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 40
    error: 50

# MARK: - Type Name

# Enforce consistent naming conventions
type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 40
    error: 50

# MARK: - Function Parameter Count

# Allow reasonable number of parameters
function_parameter_count:
  warning: 6
  error: 8

# MARK: - Nesting

# Allow reasonable nesting depth
nesting:
  type_level:
    warning: 3
    error: 4
  statement_level:
    warning: 5
    error: 6

# MARK: - Return Arrow Whitespace

# Consistent return arrow formatting
return_arrow_whitespace:
  severity: warning

# MARK: - Trailing Comma

# Enforce trailing commas for better git diffs
trailing_comma:
  mandatory_comma: false

# MARK: - Vertical Whitespace

# Consistent spacing between declarations
vertical_whitespace:
  max_empty_lines: 2

# MARK: - SwiftUI Specific Rules

# Rules that are particularly useful for SwiftUI projects
opt_in_rules:
  - prefer_self_type_over_type_of_self  # Use Self in SwiftUI
  - sorted_imports                      # Keep imports organized
  - vertical_whitespace                 # Consistent spacing in SwiftUI views

# MARK: - Performance Rules

# Rules that help with performance
opt_in_rules:
  - contains_over_filter_count          # More efficient than filter.count > 0
  - contains_over_filter_is_empty      # More efficient than filter.isEmpty
  - first_where                        # More efficient than filter.first
  - last_where                         # More efficient than filter.last
  - empty_count                        # More efficient than count == 0
  - empty_string                       # More efficient than == ""

# MARK: - Documentation

# Rules for better documentation
opt_in_rules:
  - missing_docs                       # Require documentation for public declarations
  - redundant_documentation_comments   # Remove redundant documentation

# MARK: - Testing Rules

# Rules that are useful for test files
test_rules:
  - empty_count                        # Allow count == 0 in tests
  - force_unwrapping                   # Allow force unwrapping in tests
  - implicitly_unwrapped_optional      # Allow implicitly unwrapped optionals in tests

# MARK: - Custom Rule Exclusions

# Exclude specific files or directories from certain rules
excluded_rules:
  - missing_docs:                      # Don't require docs for internal files
    - F1Vision/ContentView.swift       # Example: exclude specific files
    - F1Vision/F1VisionApp.swift       # Example: exclude app entry point

# MARK: - Output Configuration

# Configure output format
reporter: "xcode"                      # Use Xcode-compatible output
quiet: true                            # Reduce output verbosity
