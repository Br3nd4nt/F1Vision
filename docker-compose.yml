services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    restart: "unless-stopped"

  generator:
    build:
      context: ./DataGeneration/
    container_name: generator
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TRACK_LAYOUT_KEY: track_layout
      TELEMETRY_CHANNEL: telemetry_channel
    depends_on:
      - redis
    volumes:
      - "./DataGeneration/.fastf1-cache:/app/.fastf1-cache"
      - "./DataGeneration/computed_data:/app/computed_data"

  live_server:
    build:
      context: ./RealtimeServer/
    container_name: liveServer
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TRACK_LAYOUT_KEY: track_layout
      TELEMETRY_CHANNEL: telemetry_channel
    depends_on:
      - redis
      - generator
    ports:
      - "8000:8000"
      - "8000:8000/tcp"
