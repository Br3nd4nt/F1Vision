version: "3.9"

services:
  mongo:
    image: mongo:6.0
    container_name: f1vision-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: f1vision
    volumes:
      - mongo_data:/data/db

  mock-data:
    build:
      context: ./MockServer
    container_name: f1vision-mock-data
    depends_on:
      - mongo
    environment:
      MODE: "both"          # track | race | both
      TRACK: "Monaco"       # e.g. Monaco, Silverstone
      YEAR: "2024"
      FREQ: "200ms"         # snapshot frequency for real race data
      FASTF1_CACHE_DIR: "/data/.fastf1_cache"
      OUTPUT_TRACK_DIR: "/data/trackData"
      OUTPUT_RACE_DIR: "/data/raceData"
    volumes:
      - mock_data:/data
    # If you later want to persist into Mongo instead of files, wire your script here
    # and add MONGO_URL env, etc.

volumes:
  mongo_data:
  mock_data:


